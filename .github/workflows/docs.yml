name: docs

# 文档站构建门禁（规划 §五 Phase 5）。
#
# ## 为什么要 checkout 三个仓库
#
# 本站内容**不进 git**：`apps/site/content/docs/{luminous,lucent}` 由 `pnpm sync:docs`
# 从同级工作区读出来（见 apps/site/scripts/sync-docs.ts）。所以构建机必须同时能读到
# `Luminary`、`Luminous`、`Lucent` 三个仓库，且目录层级必须是平的
# （脚本按标记文件向上找 monorepo 根，再取上一级作为工作区根）。
#
# ## 触发范围
#
# 三仓的文档变更都应触发重建，但**无法用同一个 workflow 内的 paths 过滤器**跨仓库监听——
# GitHub 的 `on.push.paths` 只作用于本仓库。故这里：
#   - push / PR 到本仓库：全量跑（内容变没变都要能构建）
#   - 三仓文档变更：由各仓库自己的 workflow 触发（见下方 repository_dispatch 说明）
#
# ## 门禁范围（规划已定，不含全站死链校验）
#
#   1. `pnpm sync:docs`   —— 同步成功
#   2. `pnpm verify:docs` —— 分区计数与手写页完整（防止静默少搬内容）
#   3. `pnpm build`       —— 静态导出成功
#
# 不做死链校验：两仓文档里的相对链接按已决事项不处理（规划 §四），查死链必然误报。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 同步与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 三仓平铺 checkout：这是 sync-docs.ts 的目录假设，顺序不能变。
      # 兄弟仓库若为私有，需配置 DOCS_PAT（见下方说明），默认用 GITHUB_TOKEN。
      - name: Checkout Luminary
        uses: actions/checkout@v4
        with:
          path: Luminary

      - name: Checkout Luminous
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Luminous
          path: Luminous
          token: ${{ secrets.DOCS_PAT || github.token }}
          continue-on-error: true

      - name: Checkout Lucent
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Lucent
          path: Lucent
          token: ${{ secrets.DOCS_PAT || github.token }}
          continue-on-error: true

      # 兄弟仓库拉不到时**不要**直接失败在这里，而是让 verify:docs 给出
      # 「找不到 Luminous/Lucent 工作区」的明确诊断——那条信息比 checkout 的报错更可操作。
      - name: 检查三仓是否就位
        run: |
          for d in Luminary Luminous Lucent; do
            if [ -d "$d" ]; then
              echo "OK   $d"
            else
              echo "缺失 $d —— 若为私有仓库，请配置 DOCS_PAT（见 workflow 顶部说明）"
            fi
          done
        working-directory: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Luminary/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: Luminary

      # 同步 + 门禁 + 构建，串行；任一步非 0 即整步失败。
      #
      # ⚠️ 这里**只跑 site**，不是根 `pnpm ci:docs`：根脚本会带上 personal 与
      # workbench，而本 workflow 的职责只是文档站。文档站的改动不该让另外两个
      # app 的构建失败挡住（反之亦然）。
      - name: 同步、门禁与构建
        run: pnpm --filter @luminary/site ci:docs
        working-directory: Luminary

      - name: 产物体积摘要
        if: success()
        run: |
          echo "### 文档站产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 文件数 | $(find out -type f | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| 体积 | $(du -sh out | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML 页数 | $(find out -name '*.html' | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 体积为未压缩值。实测 Brotli 压缩率约 10%，发布时 CDN 必须开启 Brotli，详见规划 Phase 6。" >> $GITHUB_STEP_SUMMARY
        # app 已移入 apps/site/，产物在 apps/site/out。
        working-directory: Luminary/apps/site
