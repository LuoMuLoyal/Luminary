name: site

# 官网 + 文档站的构建门禁。
#
# ## 为什么本 workflow 要 checkout 三个仓库
#
# 本站内容**不进 git**：`apps/site/content/docs/{luminous,lucent}` 由 `pnpm sync:docs`
# 从同级工作区读出来（见 `packages/sync/src/`）。所以构建机必须同时能读到
# `Luminary`、`Luminous`、`Lucent` 三个仓库，且目录层级必须是平的
# （脚本按标记文件向上找 monorepo 根，再取上一级作为工作区根）。
#
# 另外两个 app（personal / desktop）**不需要**这一步——它们不依赖 `packages/sync`。
#
# ## 触发范围
#
# 用 `paths` 过滤，只在本 app 或其依赖变化时触发。
#
# ⚠️ `paths` 里必须带上 `packages/sync/**` 与 `pnpm-lock.yaml`：
#   - site 依赖 `@luminary/sync`（workspace 包），改 sync 就是改 site
#   - 依赖树变了所有 app 都可能受影响；漏了会出现"改了依赖但 CI 不跑"
#
# ⚠️ `paths` 是**白名单**语义：不写进去的路径不会触发。新增根级配置文件时记得回来看这里。
#
# ## 门禁范围（不含全站死链校验）
#
#   1. `pnpm sync:docs`   —— 同步成功
#   2. `pnpm verify:docs` —— 分区计数与手写页完整（防止静默少搬内容）
#   3. `pnpm build`       —— 静态导出成功
#
# 不做死链校验：两仓文档里的相对链接按已决事项不处理，查死链必然误报。
#
# ## 三仓文档变更如何触发
#
# GitHub 的 `on.push.paths` 只作用于**本仓库**，无法跨仓库监听。
# 兄弟仓库的变更需由它们各自的 workflow 发 `repository_dispatch`（事件类型 `docs-updated`）
# 触发本 workflow 的 `workflow_dispatch` / `repository_dispatch` 入口。
# 该联动**尚未接线**（本仓库当前无 git remote，CI 未在真实 runner 上验证过）。

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/sync/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.jsonc"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/sync/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.jsonc"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  # 供兄弟仓库（Luminous / Lucent）文档变更时触发；见上方说明
  repository_dispatch:
    types: [docs-updated]

jobs:
  build:
    name: 同步与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 三仓平铺 checkout：这是路径推导的目录假设，顺序不能变。
      # 兄弟仓库若为私有，需配置 DOCS_PAT，默认用 GITHUB_TOKEN。
      - name: Checkout Luminary
        uses: actions/checkout@v4
        with:
          path: Luminary

      - name: Checkout Luminous
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Luminous
          path: Luminous
          token: ${{ secrets.DOCS_PAT || github.token }}
          continue-on-error: true

      - name: Checkout Lucent
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Lucent
          path: Lucent
          token: ${{ secrets.DOCS_PAT || github.token }}
          continue-on-error: true

      # 兄弟仓库拉不到时**不要**直接失败在这里，而是让 verify:docs 给出
      # 「找不到 Luminous/Lucent 工作区」的明确诊断——那条信息比 checkout 的报错更可操作。
      - name: 检查三仓是否就位
        run: |
          for d in Luminary Luminous Lucent; do
            if [ -d "$d" ]; then
              echo "OK   $d"
            else
              echo "缺失 $d —— 若为私有仓库，请配置 DOCS_PAT"
            fi
          done
        working-directory: .

      # ⚠️ 必须显式指定 package_json_file。
      #
      # 本 workflow 用 `path: Luminary` 把仓库 check out 到子目录，因此 runner 的
      # 当前目录（`$GITHUB_WORKSPACE`）下**没有** package.json，只有 `Luminary/`。
      # 而本 action 默认读 `package.json` 里的 `packageManager` 来定版本，
      # 读不到就报「No pnpm version is specified」。
      #
      # 两条修法：① 这里指路径（采用）；② 写死 `version: 12`（与根 package.json 重复，
      # 版本升级时会漂移，所以不采用）。
      #
      # personal.yml / desktop.yml 不需要这一项：它们 check out 到仓库根，
      # 默认路径恰好正确。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Luminary/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Luminary/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: Luminary

      # 同步 + 门禁 + 构建，串行；任一步非 0 即整步失败。
      - name: 同步、门禁与构建
        run: pnpm --filter @luminary/site ci:docs
        working-directory: Luminary

      - name: 产物体积摘要
        if: success()
        run: |
          echo "### 站点产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 文件数 | $(find out -type f | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| 体积 | $(du -sh out | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML 页数 | $(find out -name '*.html' | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 体积为未压缩值。实测 Brotli 压缩率约 10%，**CDN 必须开启 Brotli**。" >> $GITHUB_STEP_SUMMARY
        working-directory: Luminary/apps/site

      # ⚠️ 这里校验的是 basePath 生效后的形态。若 assetPrefix 被误用（而非 basePath），
      # 或 output:'export' 被删，这一步会失败——这两种错误只在部署时才暴露。
      - name: 校验产物形态
        if: success()
        run: |
          fail=0
          [ -f out/luminous/index.html ] || { echo "::error::缺 out/luminous/index.html —— basePath 或 trailingSlash 未生效"; fail=1; }
          [ -d out/_next ]             || { echo "::error::缺 out/_next"; fail=1; }
          [ -f out/api/search.json ]   || { echo "::error::缺 out/api/search.json —— 构建收尾脚本未跑（见 finalize-export.ts）"; fail=1; }
          [ -f out/luminous.html ]     && { echo "::error::out/luminous.html 不应存在 —— trailingSlash 未生效，线上会 404"; fail=1; }
          exit $fail
        working-directory: Luminary/apps/site

      # 产物交给部署环节。
      # ⚠️ 不能把 out/ 原样上传：out/_next 必须重映射到 /luminous/_next。
      #    映射表见 docs/deployment.md。这里只存原始产物，映射由部署脚本负责。
      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: Luminary/apps/site/out
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 部署到七牛云 Kodo（仅 main 分支，PR 不部署）
  #
  # ## 为什么部署与构建分成两个 job
  #
  # 构建要在 PR 上跑（门禁），部署只能在 main 上跑。分成两个 job 后
  # `if` 只需要判一次（见下），且 PR 的失败面不会碰到任何凭据。
  #
  # ## 需要配置的 repository secrets
  #
  #   QINIU_ACCESS_KEY / QINIU_SECRET_KEY —— 七牛密钥（控制台 → 密钥管理）
  #
  # ## ⚠️ 为什么「是否配置了凭据」的判定放在 step 上而不是 job 的 if 上
  #
  # GitHub 明确**不允许在 `if` 里直接引用 secrets**（官方文档
  # workflow-syntax-for-github-actions 的「Example: Using secrets」一节：
  # "Secrets cannot be directly referenced in `if:` conditionals"）。
  # 官方给的做法是：把 secret 绑到 job 级 `env`，再在 step 的 `if` 里判
  # 那个环境变量。本 job 就按这个来：
  #
  #   job 级 `if`  —— 只判分支与事件类型（不用 secrets）
  #   首个 step    —— 读 env 里的 secret，把结论写进 `steps.creds.outputs.configured`
  #   后续 step    —— 判 `steps.creds.outputs.configured == 'true'`
  #
  # 这样在未配置凭据时（fork、或还没加 secrets），job 会跑但所有实质步骤被跳过，
  # 且 job 以**成功**结束——构建门禁已在 build job 通过，缺凭据不该让整条流水线变红。
  # ---------------------------------------------------------------------------
  deploy:
    name: 部署到七牛
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 绑定 secrets 到 env，供 step 的 if 判定（不能在 if 里直接用 secrets）
    env:
      QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
      QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
      # 空间名可用 repository variable 覆盖，默认 luminary-docs
      QINIU_BUCKET: ${{ vars.QINIU_BUCKET || 'luminary-docs' }}

    # job 级只判分支与事件：main 分支的 push / workflow_dispatch / repository_dispatch。
    # PR 不部署（PR 也拿不到 secrets）。
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    steps:
      - name: 检查凭据是否已配置
        id: creds
        run: |
          if [ -n "$QINIU_ACCESS_KEY" ] && [ -n "$QINIU_SECRET_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ 七牛凭据已配置，继续部署"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 QINIU_ACCESS_KEY / QINIU_SECRET_KEY，跳过部署。"
            echo "本 job 会以成功结束——构建门禁已在 build job 通过，缺凭据不该让整条流水线变红。"
          fi

      # ⚠️ 路径必须与 build job 的产物布局一致。
      #
      # 脚本按 `<仓库根>/apps/site/out` 找产物（见 qiniu-upload.ps1 的 $outDir），
      # 而 build job 是把 out 的内容打包成 artifact `site-out` 的。
      # 这里 check out 到 Luminary/ 子目录（与 build job 同样的层级），
      # 再把 artifact 解到 apps/site/out —— 两边对上，脚本才找得到。
      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          path: Luminary

      - name: 下载构建产物
        if: steps.creds.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-out
          path: Luminary/apps/site/out

      # qshell 官方发布页取 Linux amd64 二进制。
      # ⚠️ 固定版本号而不是 latest：上传行为直接决定线上形态，
      #    让它随上游漂移是没必要的风险。升级时改这里并跑一次部署验证。
      - name: 安装 qshell
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          QSHELL_VERSION="2.19.13"
          url="https://github.com/qiniu/qshell/releases/download/v${QSHELL_VERSION}/qshell-v${QSHELL_VERSION}-linux-amd64.tar.gz"
          echo "下载 $url"
          curl -fsSL "$url" -o qshell.tar.gz
          tar -xzf qshell.tar.gz
          # 解出的文件名随版本变化（qshell_linux_amd64 / qshell 等），统一改名
          found="$(find . -maxdepth 1 -type f -name 'qshell*' ! -name '*.tar.gz' ! -name '*.conf' | head -n1)"
          [ -n "$found" ] || { echo "::error::解压后找不到 qshell 可执行文件"; ls -la; exit 1; }
          mv "$found" qshell
          chmod +x qshell
          ./qshell version

      - name: 配置七牛账号
        if: steps.creds.outputs.configured == 'true'
        run: ./qshell account "$QINIU_ACCESS_KEY" "$QINIU_SECRET_KEY"

      # 用仓库里的脚本组装（把 out/_next 重映射到 luminous/_next）。
      # 脚本同时做上传前自检：缺 luminous/_next 或 api/search.json 会直接失败，
      # 而这两件事**只在线上暴露**——卡在 CI 比上线后再发现便宜得多。
      #
      # -StageOnly 让脚本只组装、不自己调 qshell：
      # CI 上刚下的是 Linux 版 `./qshell`，而脚本默认去工作区根找 `qshell.exe`。
      #
      # ⚠️ -StageDir 必须与下面上传的 --src-dir 一致，且都用 $RUNNER_TEMP。
      #    不显式指定的话脚本会用 `[IO.Path]::GetTempPath()`（runner 上是 /tmp），
      #    与 $RUNNER_TEMP（/home/runner/work/_temp）**不是同一个目录**，
      #    结果是安静地上传一个空目录。
      - name: 按映射表组装
        if: steps.creds.outputs.configured == 'true'
        shell: pwsh
        run: |
          ./Luminary/scripts/deploy/qiniu-upload.ps1 `
            -Domain devluo.com `
            -StageOnly `
            -StageDir "$env:RUNNER_TEMP/luminary-site-stage"

      - name: 上传到 Kodo
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ./qshell qupload2 \
            --src-dir "$RUNNER_TEMP/luminary-site-stage" \
            --bucket "$QINIU_BUCKET" \
            --overwrite \
            --rescan-local \
            --detect-mime 1 \
            --thread-count 10 \
            --skip-file-prefixes .DS_Store \
            --skip-fixed-strings .DS_Store
