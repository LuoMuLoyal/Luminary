name: lumine

# Lumine 桌面客户端的构建门禁。
#
# ## 与另外两个 workflow 的差别
#
# 本 app 有两套构建：TanStack Start 前端 + Rust 外壳，各自会失败。因此本 workflow
# **分两个 job**，让失败定位到具体一侧，而不是混在一个日志里。
#
# 注意目录已从 apps/desktop 改名为 apps/lumine（commit 936c9d2）。本文件此前
# 仍指向旧路径，导致 paths 过滤不命中、--filter @luminary/desktop 解析不到包、
# working-directory 指向不存在的目录——桌面端的 CI 门禁事实上停了。
#
# ## 分支必须与另外两个 workflow 一致
#
# 日常开发推的是 `develop`。本文件曾只监听 `[main]`，于是 develop 上的每次 push
# 都会出现一条**0 秒、0 个 job、没有日志**的失败记录（run 的 created_at 就是
# updated_at）——那不是构建红了，是门禁根本没运行，而红色的 run 看起来和
# 「代码坏了」一模一样。`codeql.yml` 与 `osv-scanner.yml` 一直是 `[main, develop]`，
# 同一个仓库里不要有两种分支口径。
#
# ## 为什么只做 `cargo check` 而不做 `tauri build`
#
# `tauri build` 会产出安装包，涉及签名、密钥、平台矩阵与较长的编译时间；
# 那是**发布流程**，不是每次 push 都该跑的。这里只验证"能编译、能过类型检查"。
# 完整打包另做 release workflow（尚未建立）。
#
# ## Rust 缓存的必要性
#
# 不缓存 `src-tauri/target` 的话每次都要全量重编依赖（tauri 依赖树很大，
# 冷编译在 CI 上要数分钟起）。`Swatinem/rust-cache` 按其约定需要指定
# `workspaces: src-tauri`。
#
# ## 前端产物形态
#
# TanStack Start 开启 SPA 模式后，`vite build` 会先预渲染 shell，再输出到
# `apps/lumine/dist/client/`：入口是 `index.html`，资源在 `assets/`。
# 不经过 Nitro / Node 服务端——Tauri 直接加载这些静态文件。

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/lumine/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - "turbo.jsonc"
      - ".github/workflows/lumine.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/lumine/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - "turbo.jsonc"
      - ".github/workflows/lumine.yml"
  workflow_dispatch:

jobs:
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @luminary/lumine lint

      - name: Format check
        run: pnpm --filter @luminary/lumine format:check

      - name: Typecheck
        run: pnpm --filter @luminary/lumine typecheck

      # 单元测试：契约错误解析、错误码映射、会话三态、单飞续期、头合并。
      # 这些是认证层最容易回归的部分（会话轮换竞态、Problem Details 解析），
      # 而它们**不依赖** Lucent 运行时——vitest 用注入的假 fetch，所以 CI 里能跑。
      - name: 单元测试
        run: pnpm --filter @luminary/lumine test

      # SPA 构建必须成功——Tauri 不支持服务端方案（见 planning §8.6）。
      - name: 构建（SPA）
        run: pnpm --filter @luminary/lumine build

      - name: 校验产物形态
        run: |
          if [ ! -f dist/client/index.html ]; then
            echo "::error::未产出 dist/client/index.html —— 检查 SPA 配置是否被误删"
            exit 1
          fi
          if [ ! -d dist/client/assets ]; then
            echo "::error::未产出 dist/client/assets/ —— 前端资源不完整"
            exit 1
          fi
          echo "dist/client 文件数: $(find dist/client -type f | wc -l)"
        working-directory: apps/lumine

      - name: 上传前端产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumine-spa
          path: apps/lumine/dist/client
          retention-days: 7

  rust:
    name: Rust 检查
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux 上编 tauri 需要 WebKitGTK 等系统库，否则 wry/tao 的构建脚本会失败。
      # Tauri 官方在 CI 文档里列出的就是这些包。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 缓存 target/，否则每次全量重编依赖
      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/lumine/src-tauri

      # ⚠️ tauri-build 在本步骤会读 tauri.conf.json 并生成 Windows Resource 之类的
      # 平台资源。Linux 上不需要 .ico，但 macOS 打包需要 .icns——若将来加 macOS 矩阵，
      # 记得补 icons/icon.icns（当前只有 .ico / .png）。
      - name: cargo check
        run: cargo check --all-targets --locked
        working-directory: apps/lumine/src-tauri

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/lumine/src-tauri
